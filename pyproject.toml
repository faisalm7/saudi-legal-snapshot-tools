[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "saudi-legal-snapshot-tools"
version = "0.4.0"
description = "Source-traceable Saudi legal text, article spans and local capture processing"
requires-python = ">=3.12"
dependencies = ["datasets==5.1.0", "pyarrow==26.0.0", "PyYAML==6.0.3"]

[project.scripts]
saudi-legal = "saudi_legal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
